<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Homepage — Table Layout</title>
</head>
<body style="margin:0;background:#fff;font-family:Arial,sans-serif;color:#537447">
<table width="340" align="center" cellpadding="0" cellspacing="3" border="0" style="margin:30px auto;border-collapse:separate;border-spacing:3px;text-align:center">
  <tr><td colspan="3" style="border:2px solid #777;height:38px;font-size:20px">Header</td></tr>
  <tr><td colspan="3" style="border:2px solid #777;height:38px;font-size:20px">Navigation Menu</td></tr>
  <tr style="height:162px">
    <td style="border:2px solid #777;width:70px">Content</td>
    <td style="border:2px solid #777;width:180px;font-size:20px">Main<br>Content</td>
    <td style="border:2px solid #777;width:70px">Content</td>
  </tr>
  <tr><td colspan="3" style="border:2px solid #777;height:38px;font-size:20px">Footer</td></tr>
</table>
</body>
</html>
