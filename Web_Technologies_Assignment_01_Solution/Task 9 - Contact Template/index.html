<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Contact Now</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="page">
<header class="greybar">Grey color</header>
<main class="canvas">
<section class="blue">
<p class="note">Blue color white text</p><h1>Contact Now</h1>
<form action="#" method="post">
<input name="username" placeholder="Username" aria-label="Username" required>
<input name="password" type="password" placeholder="Password" aria-label="Password">
<input name="department" placeholder="Department" aria-label="Department">
<textarea name="message" placeholder="Message" aria-label="Message" rows="2"></textarea>
<button type="submit">Send Message</button>
</form>
</section>
<section class="white">
<div class="social"><a href="https://facebook.com/" aria-label="Facebook">f</a><a href="https://twitter.com/" aria-label="Twitter">♥</a><a href="https://dribbble.com/" aria-label="Dribbble">◉</a><a href="https://plus.google.com/" aria-label="Google Plus">g+</a></div>
<form action="#" method="post">
<label class="input-icon"><input name="name" placeholder="Your name" aria-label="Your name"><span>♟</span></label>
<label class="input-icon"><input name="email" type="email" placeholder="Your email" aria-label="Your email"><span>✉</span></label>
<select name="departmentSelect" aria-label="Select a department"><option value="">Select a Department</option><option>Computer Science</option><option>Admissions</option><option>Administration</option></select>
<textarea name="details" rows="5" placeholder="Write your message here" aria-label="Write your message"></textarea>
</form>
</section>
</main>
<footer class="greybar bottom">Grey color</footer>
</div>
</body></html>
