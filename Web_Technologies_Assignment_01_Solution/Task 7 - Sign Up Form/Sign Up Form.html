<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create an Account</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#c8c8c8;font-family:Arial,sans-serif;color:#fff}
.outer{width:min(720px,94%);margin:18px auto;background:#c8c8c8;padding:12px 0 28px}
.labelbox{margin:0 auto 20px;width:82px;border:2px solid #555;background:#fff;color:#111;padding:9px;text-align:center}
.panel{background:#394d55;padding:35px 7%;text-align:center}
form{max-width:455px;margin:auto}.social{width:100%;border-collapse:collapse;margin:8px 0 0}
.social td{padding:11px 8px;color:#fff;font-size:12px}.fb{background:#263f85}.tw{background:#62b7e7}
.or{font-size:12px;margin:0 0 20px}.fields{width:100%;border-collapse:collapse;margin-bottom:12px}
.fields td{padding:0}.fields input,.wide{width:100%;height:36px;padding:10px 12px;background:#fff;border:1px solid #d6d6d6;color:#333;font-size:12px}
.fields td:first-child input{border-left:4px solid #56b89b}.wide{display:block;margin-bottom:12px}
.terms{text-align:left;font-size:11px;color:#eee;margin:18px 0}.terms a{color:#6ebee5}
.create{width:100%;padding:13px;background:#36a878;color:#fff;border:0;cursor:pointer;font-size:13px}
.credit{font-size:11px;color:#eee;margin:26px 0 0}.credit a{color:#8cc4e6}
</style>
</head>
<body>
<div class="outer">
  <div class="labelbox">Grey</div>
  <main class="panel">
    <form action="#" method="post">
      <table class="social" aria-label="Social sign up links"><tr>
        <td class="fb"><a href="https://www.facebook.com/" style="color:white;text-decoration:none" target="_blank" rel="noopener">f &nbsp; Connect with Facebook</a></td>
        <td class="tw"><a href="https://twitter.com/" style="color:white;text-decoration:none" target="_blank" rel="noopener">♥ &nbsp; Connect with Twitter</a></td>
      </tr></table>
      <div class="or">Or sign up with</div>
      <table class="fields" aria-label="Name fields"><tr>
        <td><input name="firstName" placeholder="First Name" aria-label="First name" required></td>
        <td><input name="lastName" placeholder="Last Name" aria-label="Last name" required></td>
      </tr></table>
      <input class="wide" type="email" name="email" placeholder="your@email.com" aria-label="Email" required>
      <input class="wide" type="password" name="password" placeholder="••••••••" aria-label="Password" minlength="8" required>
      <p class="terms">By creating an account, you agree to our <a href="#terms">Terms &amp; Conditions</a>.</p>
      <button class="create" type="submit">Create account</button>
      <p class="credit">Template by <a href="https://w3layouts.com/" target="_blank" rel="noopener">w3layouts</a></p>
      <p id="terms" class="terms">Terms &amp; Conditions: provide accurate information and keep your password secure.</p>
    </form>
  </main>
</div>
</body>
</html>
