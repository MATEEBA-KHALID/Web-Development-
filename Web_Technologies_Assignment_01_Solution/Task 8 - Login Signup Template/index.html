<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Member Login and Sign Up</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="outer"><div class="topnote">Grey color</div>
<main class="stage">
<section class="login">
<table><tr><th colspan="2">Member Login <span>Grey</span></th></tr>
<tr><td><input placeholder="User Name" aria-label="User name"></td><td class="ok">✓</td></tr>
<tr><td><input type="password" placeholder="Password" aria-label="Password"></td><td class="bad">×</td></tr>
<tr><td><a href="#forgot">Forgot password?</a></td><td><button type="button">Login</button></td></tr></table>
<p id="forgot">Forgot your password? Contact the site administrator.</p>
</section>
<section class="signup"><table>
<tr><th colspan="2">Sign Up - It's free <span>Grey</span></th></tr>
<tr><td><input placeholder="User Name" aria-label="New username"></td><td><input type="password" placeholder="Password" aria-label="New password"></td></tr>
<tr><td><input type="email" placeholder="info@xyz.com" aria-label="Email"></td><td><input type="email" placeholder="Re-confirm email" aria-label="Confirm email"></td></tr>
<tr><th colspan="2">Personal Details</th></tr>
<tr><td><input placeholder="First Name" aria-label="First name"></td><td><input placeholder="Last Name" aria-label="Last name"></td></tr>
<tr><td><input type="email" placeholder="Your Email" aria-label="Personal email"></td><td><input type="email" placeholder="Re-enter email" aria-label="Re-enter email"></td></tr>
<tr><td><input placeholder="City" aria-label="City"></td><td><input placeholder="Province" aria-label="Province"></td></tr>
<tr><td><input placeholder="Address1" aria-label="Address line one"></td><td><input placeholder="Address2" aria-label="Address line two"></td></tr>
<tr><td colspan="2"><select aria-label="Country"><option value="">Country</option><option>Pakistan</option><option>Other</option></select></td></tr>
<tr><td colspan="2" class="submit"><button type="button">Sign up</button></td></tr>
</table></section>
</main><div class="bottomnote">© 2014 Template by Web Technologies</div></div>
</body></html>
